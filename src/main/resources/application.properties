# Nombre de la aplicacion
spring.application.name=sincro-spring

# Conexion con la base de datos del proyecto Sincro
spring.datasource.url=jdbc:mysql://localhost:3306/sincro
spring.datasource.username=root
spring.datasource.password=1234

# Las tablas ya existen, por eso Hibernate no debe crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=none

# Muestra en la consola las consultas que genera el framework
spring.jpa.show-sql=true

# Puerto en el que queda escuchando la aplicacion
server.port=8080
